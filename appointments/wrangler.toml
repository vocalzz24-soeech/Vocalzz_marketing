name = "vocalzz-appointments"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Reminder check runs every 5 minutes.
# Static files (PDF library, logo) served before the Worker runs.
[assets]
directory = "./public"

# Smart Placement: Cloudflare runs the app close to the database when that is faster,
# so each page's database work does not travel back and forth across the world.
[placement]
mode = "smart"

[triggers]
# Every 5 minutes: WhatsApp reminders. Sundays 16:00 UTC (9:30 PM IST): weekly report email.
crons = ["*/5 * * * *", "0 16 * * SUN"]

[[d1_databases]]
binding = "DB"
# Asia-Pacific database, live since 16 Nov 2026 (moved from the old US one, "vocalzz-appointments",
# which is kept untouched in the Cloudflare dashboard as a backup).
database_name = "vocalzz-db-asia"
database_id = "bf36ceff-45fe-419b-83de-8c122bc51d0e"
migrations_dir = "migrations"

[vars]
CLINIC_NAME = "Vocalzz Speech & Audio"
CLINIC_ADDRESS = "Tower E-004, Logix Blossom County, Sector 137, Noida 201304"
CLINIC_WHATSAPP = "919910671188"
CLINIC_EMAIL = "contactus@vocalzz.com"
CLINIC_WEBSITE = "vocalzz.com"
DEFAULT_DURATION_MIN = "40"
# Default length of a new patient's consultation (minutes).
CONSULT_DURATION_MIN = "30"
OPEN_HOUR = "10"
CLOSE_HOUR = "20"
WHATSAPP_TEMPLATE_LANG = "en"
# Sender of report emails; the domain must be verified in Resend.
REPORT_EMAIL_FROM = "Vocalzz Reports <reports@vocalzz.com>"
# Google Search Console property for the SEO report page (keys GSC_CLIENT_EMAIL / GSC_PRIVATE_KEY are secrets).
GSC_SITE = "sc-domain:vocalzz.com"
# Google Ads report page: account to read (same service account key as the SEO report).
GADS_CUSTOMER_ID = "8983920631"
# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   WHATSAPP_TOKEN            Meta permanent access token
#   WHATSAPP_PHONE_NUMBER_ID  Meta phone number id of the sending number (a separate API SIM;
#                             automatic messages only; parents reply on +91 99106 71188)
# Without them, messages are recorded as "dry_run" and not sent.
#   RESEND_API_KEY            resend.com API key for the weekly report email (secret)
#   REPORT_EMAIL_TO           where the weekly report goes (a secret too, so the address stays out of this file)
