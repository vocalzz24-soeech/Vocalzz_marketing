name = "vocalzz-appointments"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Reminder check runs every 5 minutes.
# Static files (PDF library, logo) served before the Worker runs.
[assets]
directory = "./public"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vocalzz-appointments"
# No database_id: on the first deploy, Wrangler creates this database automatically
# and links it. To use an existing database instead, add its database_id here.
migrations_dir = "migrations"

[vars]
CLINIC_NAME = "Vocalzz"
CLINIC_ADDRESS = "Tower E-004, Logix Blossom County, Sector 137, Noida 201304"
CLINIC_WHATSAPP = "918800230240"
CLINIC_EMAIL = "contactus@vocalzz.com"
CLINIC_WEBSITE = "vocalzz.com"
DEFAULT_DURATION_MIN = "45"
OPEN_HOUR = "10"
CLOSE_HOUR = "21"
WHATSAPP_TEMPLATE_LANG = "en"
# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   WHATSAPP_TOKEN            Meta permanent access token
#   WHATSAPP_PHONE_NUMBER_ID  Meta phone number id for +91 88002 30240
# Without them, messages are recorded as "dry_run" and not sent.
